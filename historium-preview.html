<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historium</title>
  <meta name="description" content="Historium: تاریخ کشورها، شخصیت‌های مهم و قدمت ملت‌ها. The history of countries, important figures and the age of nations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:wght@400;500;700&family=IM+Fell+English&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <style>
/* ==========================================================
   Historium - stylesheet
   Theme: old parchment, ink and wax seal
   Works in both RTL (Persian) and LTR (English) using logical properties
   ========================================================== */

:root {
  --parchment: #e8dbbc;
  --vellum: #f4ecd6;
  --ink: #2a1c12;
  --walnut: #5b3b22;
  --seal: #6f1f1c;
  --gold: #a27d2f;
  --line: rgba(91, 59, 34, 0.35);
  --header-h: 68px;
  --measure: 68ch;
}

html[lang="fa"] {
  --font-display: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-body: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
  --lh: 2;
  --base: 1.1875rem;
}
html[lang="en"] {
  --font-display: "IM Fell English", "EB Garamond", Georgia, "Times New Roman", serif;
  --font-body: "EB Garamond", Georgia, "Times New Roman", serif;
  --lh: 1.65;
  --base: 1.25rem;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--base);
  line-height: var(--lh);
  background:
    radial-gradient(ellipse at 50% 0%, #f1e7cc 0%, var(--parchment) 55%, #d6c39a 100%) fixed;
  display: flex;
  flex-direction: column;
}

/* paper grain */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.55;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

body > * { position: relative; z-index: 1; }

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1.25;
  margin: 0 0 0.5em;
  color: var(--ink);
}
html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3, html[lang="en"] h4 { font-weight: 400; }

h1 { font-size: clamp(2rem, 4vw, 3rem); }
h2 { font-size: clamp(1.5rem, 2.6vw, 2rem); }
h3 { font-size: 1.3rem; }

p { margin: 0 0 1em; max-width: var(--measure); }

a { color: var(--seal); text-underline-offset: 0.2em; }
a:hover { color: var(--ink); }

:focus-visible {
  outline: 3px solid var(--seal);
  outline-offset: 3px;
}

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  inset-inline-start: 1rem;
  top: -4rem;
  background: var(--vellum);
  color: var(--ink);
  padding: 0.5rem 1rem;
  border: 2px solid var(--seal);
  z-index: 100;
}
.skip-link:focus { top: 0.75rem; }

/* ---------- reading progress ---------- */
#progress {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--seal);
  transform: scaleX(0);
  transform-origin: left;
  z-index: 60;
  display: none;
}
html[dir="rtl"] #progress { transform-origin: right; }
body.has-progress #progress { display: block; }

/* ---------- header ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  min-height: var(--header-h);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem 1.5rem;
  padding: 0.5rem clamp(1rem, 4vw, 3rem);
  background: rgba(244, 236, 214, 0.94);
  border-bottom: 4px double var(--walnut);
  backdrop-filter: blur(4px);
}

.logo {
  font-family: "IM Fell English", "EB Garamond", Georgia, serif;
  font-size: 1.9rem;
  letter-spacing: 0.02em;
  color: var(--ink);
  text-decoration: none;
  direction: ltr;
  unicode-bidi: isolate;
}
.logo:hover { color: var(--seal); }

.main-nav {
  display: flex;
  gap: 0.25rem 1.25rem;
  flex-wrap: wrap;
  flex: 1;
}
.main-nav a {
  color: var(--walnut);
  text-decoration: none;
  padding: 0.25rem 0.1rem;
  border-bottom: 2px solid transparent;
}
.main-nav a:hover { color: var(--ink); border-bottom-color: var(--gold); }
.main-nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--seal); font-weight: 700; }

.lang-btn {
  font: inherit;
  color: var(--ink);
  background: var(--vellum);
  border: 1px solid var(--walnut);
  padding: 0.2rem 0.9rem;
  cursor: pointer;
  border-radius: 2px;
}
.lang-btn:hover { background: var(--parchment); }

main { flex: 1; }
main:focus, main:focus-visible { outline: none; }

.page {
  width: min(1120px, 100% - 2rem);
  margin-inline: auto;
  padding-block: 2.5rem 4rem;
}

.lead { font-size: 1.15em; color: var(--walnut); }

/* ---------- hero: the scroll ---------- */
.hero { padding: 2.5rem 1rem 1rem; }

.scroll {
  width: min(920px, 100%);
  margin-inline: auto;
}

.scroll-rod {
  position: relative;
  height: 24px;
  border-radius: 12px;
  background: linear-gradient(#3a2313, #8a5e37 45%, #3a2313);
  box-shadow: 0 6px 10px rgba(42, 28, 18, 0.35);
}
.scroll-rod::before, .scroll-rod::after {
  content: "";
  position: absolute;
  top: -5px;
  width: 22px; height: 34px;
  border-radius: 8px;
  background: linear-gradient(#2c1a0e, #7b5230 50%, #2c1a0e);
}
.scroll-rod::before { inset-inline-start: -14px; }
.scroll-rod::after { inset-inline-end: -14px; }

.scroll-sheet {
  margin-inline: 18px;
  padding: clamp(2.5rem, 7vw, 5rem) clamp(1.25rem, 5vw, 4rem);
  text-align: center;
  background:
    linear-gradient(90deg, rgba(91, 59, 34, 0.28), transparent 7%, transparent 93%, rgba(91, 59, 34, 0.28)),
    radial-gradient(ellipse at 50% 40%, #f6eed8 0%, #ecdfbf 70%, #dcc89b 100%);
  box-shadow: inset 0 0 60px rgba(111, 70, 30, 0.25);
  animation: unroll 1.5s cubic-bezier(0.3, 0.7, 0.2, 1) both;
}
@keyframes unroll {
  from { clip-path: inset(0 0 100% 0); }
  to { clip-path: inset(0 0 0 0); }
}
@media (prefers-reduced-motion: reduce) {
  .scroll-sheet { animation: none; }
}

.slogan {
  font-size: clamp(2.6rem, 8vw, 5.4rem);
  line-height: 1.15;
  margin: 0 0 0.25em;
}
.slogan-alt {
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 3vw, 1.9rem);
  color: var(--walnut);
  margin: 0 0 1.25rem;
}
.tagline {
  margin-inline: auto;
  color: var(--walnut);
  border-top: 1px solid var(--gold);
  padding-top: 1rem;
  display: inline-block;
}

/* ---------- decorative section title ---------- */
.section-title {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 3rem 0 1.25rem;
}
.section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
}
html[dir="rtl"] .section-title::after { background: linear-gradient(270deg, var(--gold), transparent); }
.section-title h2 { margin: 0; }

/* ---------- framed boxes (manuscript frame) ---------- */
.frame {
  background: var(--vellum);
  border: 1px solid var(--gold);
  box-shadow:
    inset 0 0 0 4px var(--vellum),
    inset 0 0 0 5px rgba(162, 125, 47, 0.6),
    0 2px 0 rgba(91, 59, 34, 0.25);
  border-radius: 2px;
}

/* ---------- entry cards on home ---------- */
.entry-grid {
  display: grid;
  gap: 1.25rem;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}
.entry {
  display: block;
  padding: 2rem 1.75rem;
  text-decoration: none;
  color: var(--ink);
}
.entry:hover { background: #f9f2de; color: var(--ink); }
.entry h3 { margin-top: 0.75rem; }
.entry p { color: var(--walnut); margin: 0; }
.entry svg { width: 44px; height: 44px; stroke: var(--seal); fill: none; stroke-width: 1.6; }

/* ---------- today / latest ---------- */
.today { padding: 1.75rem; }
.today h3 { margin-bottom: 0.25rem; }
.today .date { color: var(--seal); font-weight: 700; margin-bottom: 0.5rem; }
.today .note { color: var(--walnut); font-size: 0.9em; margin-bottom: 1rem; }

.latest-list { list-style: none; margin: 0; padding: 0; }
.latest-list li {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1rem;
  padding: 0.75rem 0;
  border-bottom: 1px dashed var(--line);
}
.latest-list .kind { color: var(--walnut); min-width: 5em; }
.latest-list .when { margin-inline-start: auto; color: var(--walnut); font-size: 0.9em; }

/* ---------- flags ---------- */
.flag {
  display: block;
  width: 100%;
  height: 100%;
  border: 1px solid rgba(42, 28, 18, 0.5);
}
.flag-img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* ---------- search ---------- */
.searchbar { margin: 1.5rem 0 2rem; max-width: 460px; }
.searchbar input,
.filters select {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--vellum);
  border: 1px solid var(--walnut);
  border-radius: 2px;
  padding: 0.6rem 0.9rem;
}

/* ---------- country cards ---------- */
.card-grid {
  display: grid;
  gap: 1.5rem;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
}
.country-card {
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: var(--ink);
  overflow: hidden;
}
.country-card:hover { background: #f9f2de; color: var(--ink); }
.country-card .flag-band { height: 84px; margin: 10px 10px 0; }
.country-card .body { padding: 1rem 1.25rem 1.4rem; }
.country-card h3 { margin-bottom: 0.1em; }
.country-card .age { color: var(--seal); font-weight: 700; margin-bottom: 0.4rem; }
.country-card .sum { color: var(--walnut); font-size: 0.92em; line-height: 1.6; margin: 0; }

.empty {
  padding: 2rem;
  text-align: center;
  color: var(--walnut);
  border: 1px dashed var(--walnut);
}

/* ---------- country page ---------- */
.crumb { margin-bottom: 1.5rem; }
.country-head {
  display: grid;
  grid-template-columns: 160px 1fr auto;
  gap: 1.5rem 2rem;
  align-items: center;
  margin-bottom: 2.5rem;
}
.country-head .flag-big { width: 160px; height: 108px; }
.country-head h1 { margin: 0; }

.seal {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 128px; height: 128px;
  border-radius: 50%;
  text-decoration: none;
  color: #f4ecd6;
  background: radial-gradient(circle at 35% 30%, #9a3a33, var(--seal) 60%, #4b1311);
  box-shadow: inset 0 0 0 5px rgba(244, 236, 214, 0.18), 0 4px 10px rgba(42, 28, 18, 0.4);
  text-align: center;
  line-height: 1.25;
}
.seal:hover { color: #fff; filter: brightness(1.1); }
.seal .n { font-family: var(--font-display); font-size: 2.1rem; }
.seal .u { font-size: 0.85rem; }

.country-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  gap: 3rem;
  align-items: start;
}
.country-main section { scroll-margin-top: calc(var(--header-h) + 1.25rem); margin-bottom: 3rem; }
.country-main section > h2 {
  border-bottom: 1px solid var(--gold);
  padding-bottom: 0.3em;
}

.side { position: sticky; top: calc(var(--header-h) + 1.25rem); display: grid; gap: 1.25rem; }
.side .box { padding: 1.25rem 1.4rem; }
.side h2 { font-size: 1.2rem; margin-bottom: 0.6rem; }
.facts { margin: 0; }
.facts div { padding: 0.4rem 0; border-bottom: 1px dashed var(--line); }
.facts div:last-child { border-bottom: 0; }
.facts dt { color: var(--walnut); font-size: 0.85em; }
.facts dd { margin: 0; font-weight: 700; }

.toc { list-style: none; margin: 0; padding: 0; }
.toc li { margin: 0; }
.toc a {
  display: block;
  padding: 0.25rem 0;
  color: var(--walnut);
  text-decoration: none;
  line-height: 1.5;
}
.toc a:hover { color: var(--seal); }

.why-date {
  margin-top: 1rem;
  padding: 0.9rem 1.1rem;
  border-inline-start: 3px solid var(--gold);
  background: rgba(244, 236, 214, 0.6);
  font-size: 0.95em;
}
.why-date p { margin: 0; }

/* timeline */
.timeline { list-style: none; margin: 0; padding: 0; border-inline-start: 2px solid var(--walnut); margin-inline-start: 0.6rem; }
.timeline > li { position: relative; padding-inline-start: 1.5rem; margin-bottom: 0.25rem; }
.timeline > li::before {
  content: "";
  position: absolute;
  inset-inline-start: -0.62rem;
  top: 0.8rem;
  width: 0.9rem; height: 0.9rem;
  border-radius: 50%;
  background: var(--parchment);
  border: 2px solid var(--seal);
}
.timeline details { border-bottom: 1px dashed var(--line); padding: 0.4rem 0; }
.timeline summary {
  cursor: pointer;
  display: flex;
  flex-wrap: wrap;
  gap: 0.2rem 1rem;
  align-items: baseline;
  list-style: none;
  padding: 0.2rem 0;
}
.timeline summary::-webkit-details-marker { display: none; }
.timeline summary:hover .t-title { color: var(--seal); }
.timeline .t-year { font-family: var(--font-display); font-weight: 700; font-size: 1.15em; color: var(--seal); min-width: 5.5em; }
.timeline .t-title { font-weight: 700; }
.timeline .t-text { margin: 0.4rem 0 0.4rem; color: var(--walnut); }
.timeline summary::after {
  content: "+";
  margin-inline-start: auto;
  color: var(--walnut);
  font-size: 1.3em;
  line-height: 1;
}
.timeline details[open] summary::after { content: "\2212"; }

/* mini cards for figures */
.mini-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.fig-card {
  display: flex;
  gap: 1rem;
  align-items: center;
  padding: 1rem 1.1rem;
  text-decoration: none;
  color: var(--ink);
}
.fig-card:hover { background: #f9f2de; color: var(--ink); }
.fig-card .nm { font-weight: 700; line-height: 1.35; }
.fig-card .yr { color: var(--walnut); font-size: 0.88em; }
.fig-card .kn { color: var(--walnut); font-size: 0.88em; line-height: 1.5; }

.mono {
  flex: none;
  width: 56px; height: 56px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 1.6rem;
  color: var(--vellum);
  background: radial-gradient(circle at 35% 30%, #7a5231, var(--walnut) 65%, #35200f);
  overflow: hidden;
}
.mono img { width: 100%; height: 100%; object-fit: cover; }
.mono.big { width: 120px; height: 120px; font-size: 3.4rem; }

/* gallery */
.gallery { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.gallery figure { margin: 0; padding: 0.6rem; }
.gallery img { width: 100%; height: 170px; object-fit: cover; display: block; }
.gallery figcaption { font-size: 0.88em; color: var(--walnut); padding-top: 0.4rem; line-height: 1.5; }

.pager {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  border-top: 4px double var(--walnut);
  padding-top: 1.5rem;
  margin-top: 1rem;
}
.pager a { text-decoration: none; padding: 0.5rem 0; }
.pager small { display: block; color: var(--walnut); }

/* ---------- figures page ---------- */
.filters {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  align-items: end;
  margin: 1.5rem 0;
}
.filters label { display: block; color: var(--walnut); font-size: 0.9em; margin-bottom: 0.25rem; }
.btn {
  font: inherit;
  color: var(--vellum);
  background: var(--seal);
  border: 1px solid #4b1311;
  border-radius: 2px;
  padding: 0.6rem 1.1rem;
  cursor: pointer;
}
.btn:hover { background: #4b1311; }

.era-nav {
  position: sticky;
  top: var(--header-h);
  z-index: 10;
  display: flex;
  gap: 0.25rem 1.25rem;
  flex-wrap: wrap;
  padding: 0.6rem 1rem;
  margin-bottom: 1.5rem;
  background: rgba(244, 236, 214, 0.95);
  border-block: 1px solid var(--gold);
}
.era-nav a { color: var(--walnut); text-decoration: none; padding: 0.1rem 0; border-bottom: 2px solid transparent; }
.era-nav a:hover { color: var(--ink); border-bottom-color: var(--seal); }

.era { scroll-margin-top: calc(var(--header-h) + 4rem); margin-bottom: 2.5rem; }
.era-banner {
  padding: 1.1rem 1.5rem;
  margin-bottom: 1rem;
  border-inline-start: 8px solid var(--era, var(--gold));
  background: rgba(244, 236, 214, 0.75);
}
.era-banner h2 { margin: 0; }
.era-banner .range { color: var(--walnut); font-size: 0.92em; }
.era-banner p { margin: 0.3rem 0 0; color: var(--walnut); font-size: 0.95em; }

/* ---------- figure page ---------- */
.fig-head { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; margin-bottom: 2rem; }
.fig-head h1 { margin-bottom: 0.1em; }
.fig-head .meta { color: var(--walnut); }
.fig-body { max-width: var(--measure); }
.fig-body h2 { border-bottom: 1px solid var(--gold); padding-bottom: 0.3em; margin-top: 2rem; }
.fig-body ul { padding-inline-start: 1.4rem; }
.fig-body li { margin-bottom: 0.4rem; }
blockquote.quote {
  margin: 1.5rem 0;
  padding: 0.5rem 1.25rem;
  border-inline-start: 4px solid var(--seal);
  font-family: var(--font-display);
  font-size: 1.3em;
}

/* ---------- ages timeline ---------- */
.ages-scroller {
  overflow-x: auto;
  padding: 1rem 0.5rem 2rem;
  margin-top: 1.5rem;
}
.ages-track {
  display: flex;
  gap: 2rem;
  align-items: flex-start;
  position: relative;
  min-width: max-content;
  padding-top: 4rem;
}
.ages-track::before {
  content: "";
  position: absolute;
  top: 3.05rem;
  inset-inline: 0;
  height: 4px;
  background: var(--walnut);
}
.age-item { width: 250px; position: relative; }
.age-item .yr {
  position: absolute;
  top: -3.3rem;
  inset-inline-start: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.3rem;
  color: var(--seal);
  line-height: 1.2;
}
.age-item .dot {
  position: absolute;
  top: -1.45rem;
  inset-inline-start: 0;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--seal);
  border: 3px solid var(--parchment);
  box-shadow: 0 0 0 1px var(--walnut);
}
.age-card { padding: 1.25rem 1.25rem 1.25rem; }
.age-card h3 { margin-bottom: 0.15em; }
.age-card .big-n { font-family: var(--font-display); font-size: 1.6rem; color: var(--seal); line-height: 1.3; }
.age-card details { margin-top: 0.75rem; font-size: 0.92em; color: var(--walnut); }
.age-card summary { cursor: pointer; color: var(--seal); }
.age-card details p { margin: 0.5rem 0 0; line-height: 1.7; }
.hint { color: var(--walnut); font-size: 0.92em; }

/* ---------- footer ---------- */
.site-footer {
  margin-top: 2rem;
  padding: 1.75rem 1rem;
  text-align: center;
  color: var(--walnut);
  border-top: 4px double var(--walnut);
  background: rgba(244, 236, 214, 0.7);
  font-size: 0.95rem;
}
.site-footer p { margin: 0 auto; }

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  .country-layout { grid-template-columns: 1fr; }
  .side { position: static; order: -1; }
  .country-head { grid-template-columns: 120px 1fr; }
  .country-head .flag-big { width: 120px; height: 82px; }
  .country-head .seal { grid-column: 1 / -1; justify-self: start; }
}
@media (max-width: 560px) {
  .site-header { gap: 0.25rem 1rem; }
  .main-nav { order: 3; flex-basis: 100%; }
  :root { --header-h: 0px; }
  .site-header { position: static; }
  .scroll-sheet { margin-inline: 12px; }
  .era-nav { position: static; }
}

</style>
</head>
<body>

      ['/countries', 'countries', 'cardCountriesTitle', 'cardCountriesText'],
      ['/figures', 'figures', 'cardFiguresTitle', 'cardFiguresText'],
      ['/ages', 'ages', 'cardAgesTitle', 'cardAgesText']
    ].map(function (e) {
      return '<a class="entry frame" href="#' + e[0] + '">' + ICONS[e[1]] +
        '<h3>' + esc(t(e[2])) + '</h3><p>' + esc(t(e[3])) + '</p></a>';
    }).join('');

    var html = hero + '<div class="page">' +
      sectionTitle(t('introTitle')) + '<p class="lead">' + esc(t('intro')) + '</p>' +
      '<div class="entry-grid" style="margin-top:2rem">' + entries + '</div>';

    var today = pickToday();
    if (today) {
      html += sectionTitle(t('todayTitle'));
      html += '<div class="today frame">';
      html += '<p class="note">' + esc(today.exact ? t('todayExact') : t('todayNext')) + '</p>';
      today.entries.forEach(function (e, i) {
        html += '<div' + (i ? ' style="margin-top:1.25rem"' : '') + '>' +
          '<p class="date">' + esc(fmtDate(e.month, e.day, e.year)) + '</p>' +
          '<h3>' + esc(L(e.title)) + '</h3><p>' + esc(L(e.text)) + '</p>' +
          (e.country && findCountry(e.country) ? '<a href="#/country/' + esc(e.country) + '">' + esc(t('readMore')) + '</a>' : '') +
          '</div>';
      });
      html += '</div>';
    }

    var items = [];
    D.countries.forEach(function (c) { if (c.added) { items.push({ kind: 'typeCountry', href: '#/country/' + c.id, name: L(c.name), added: c.added }); } });
    D.figures.forEach(function (f) { if (f.added) { items.push({ kind: 'typeFigure', href: '#/figure/' + f.id, name: L(f.name), added: f.added }); } });
    items.sort(function (a, b) { return a.added < b.added ? 1 : (a.added > b.added ? -1 : 0); });
    items = items.slice(0, 5);
    if (items.length) {
      html += sectionTitle(t('latestTitle'));
      html += '<div class="frame" style="padding:0.75rem 1.5rem"><ul class="latest-list">' + items.map(function (it) {
        return '<li><span class="kind">' + esc(t(it.kind)) + '</span><a href="' + esc(it.href) + '">' + esc(it.name) + '</a>' +
          '<span class="when">' + fmtISO(it.added) + '</span></li>';
      }).join('') + '</ul></div>';
    }
    return html + '</div>';
  }

  function viewCountries() {
    return '<div class="page"><h1>' + esc(t('countriesTitle')) + '</h1>' +
      '<p class="lead">' + esc(t('countriesLead')) + '</p>' +
      '<div class="searchbar"><label for="q" class="sr-only">' + esc(t('searchLabel')) + '</label>' +
      '<input id="q" type="search" autocomplete="off" placeholder="' + esc(t('searchPlaceholder')) + '"></div>' +
      '<div class="card-grid" id="country-grid">' + D.countries.map(countryCard).join('') + '</div>' +
      '<p class="empty" id="no-results" hidden>' + esc(t('noResults')) + '</p></div>';
  }

  function viewCountry(c) {
    var idx = D.countries.indexOf(c);
    var prev = D.countries[idx - 1], next = D.countries[idx + 1];
    var figs = D.figures.filter(function (f) { return f.country === c.id; }).sort(function (a, b) { return a.born - b.born; });
    var toc = [['sec-overview', t('overviewTitle')]];
    (c.sections || []).forEach(function (s) { toc.push(['sec-' + s.id, L(s.title)]); });
    if (c.timeline && c.timeline.length) { toc.push(['sec-timeline', t('timelineTitle')]); }
    if (figs.length) { toc.push(['sec-figures', t('figuresOfCountry')]); }
    if (c.gallery && c.gallery.length) { toc.push(['sec-gallery', t('galleryTitle')]); }

    var facts = '<div><dt>' + esc(t('factFounded')) + '</dt><dd>' + esc(yearLabel(c.founded)) + '</dd></div>';
    if (c.facts) {
      [['capital', 'factCapital'], ['language', 'factLanguage'], ['population', 'factPopulation']].forEach(function (k) {
        if (c.facts[k[0]]) { facts += '<div><dt>' + esc(t(k[1])) + '</dt><dd>' + esc(L(c.facts[k[0]])) + '</dd></div>'; }
      });
    }

    var html = '<div class="page">' +
      '<p class="crumb"><a href="#/countries">' + esc(t('backToCountries')) + '</a></p>' +
      '<header class="country-head">' + flagHTML(c, 'flag-big') +
      '<div><h1>' + esc(L(c.name)) + '</h1><p class="lead" style="margin:0.25rem 0 0">' + esc(L(c.summary)) + '</p></div>' +
      '<a class="seal" href="#/ages" aria-label="' + esc(t('ageBadgeLabel')) + '"><span class="n">' + esc(num(ageOf(c))) + '</span><span class="u">' + esc(t('ageSealUnit')) + '</span></a>' +
      '</header>' +
      '<div class="country-layout"><div class="country-main">';

    html += '<section id="sec-overview"><h2>' + esc(t('overviewTitle')) + '</h2>' + paragraphs(c.overview);
    if (c.foundedNote) {
      html += '<div class="why-date"><strong>' + esc(t('whyDate')) + '</strong><p>' + esc(L(c.foundedNote)) + '</p></div>';
    }
    html += '</section>';

    (c.sections || []).forEach(function (s) {
      html += '<section id="sec-' + esc(s.id) + '"><h2>' + esc(L(s.title)) + '</h2>' + paragraphs(s.text) + '</section>';
    });

    if (c.timeline && c.timeline.length) {
      html += '<section id="sec-timeline"><h2>' + esc(t('timelineTitle')) + '</h2><p class="hint">' + esc(t('timelineHint')) + '</p><ol class="timeline">';
      c.timeline.forEach(function (ev) {
        html += '<li><details><summary><span class="t-year">' + esc(ev.yearText ? L(ev.yearText) : yearLabel(ev.year)) + '</span>' +
          '<span class="t-title">' + esc(L(ev.title)) + '</span></summary>' +
          '<p class="t-text">' + esc(L(ev.text)) + '</p></details></li>';
      });
      html += '</ol></section>';
    }

    if (figs.length) {
      html += '<section id="sec-figures"><h2>' + esc(t('figuresOfCountry')) + '</h2><div class="mini-grid">' + figs.map(figCard).join('') + '</div></section>';
    }
    if (c.gallery && c.gallery.length) {
      html += '<section id="sec-gallery"><h2>' + esc(t('galleryTitle')) + '</h2><div class="gallery">' + c.gallery.map(function (g) {
        return '<figure class="frame"><img src="' + esc(g.src) + '" alt="' + esc(L(g.caption)) + '" loading="lazy"><figcaption>' + esc(L(g.caption)) + '</figcaption></figure>';
      }).join('') + '</div></section>';
    }

    html += '</div><aside class="side">' +
      '<div class="box frame"><h2>' + esc(t('quickFacts')) + '</h2><dl class="facts">' + facts + '</dl></div>' +
      '<nav class="box frame" aria-label="' + esc(t('toc')) + '"><h2>' + esc(t('toc')) + '</h2><ul class="toc">' +
      toc.map(function (x) { return '<li><a href="#/country/' + esc(c.id) + '" data-scroll="' + esc(x[0]) + '">' + esc(x[1]) + '</a></li>'; }).join('') +
      '</ul></nav></aside></div>';

    if (prev || next) {
      html += '<nav class="pager" aria-label="' + esc(t('navCountries')) + '">' +
        (prev ? '<a href="#/country/' + esc(prev.id) + '"><small>' + esc(t('prevCountry')) + '</small>' + esc(L(prev.name)) + '</a>' : '<span></span>') +
        (next ? '<a href="#/country/' + esc(next.id) + '"><small>' + esc(t('nextCountry')) + '</small>' + esc(L(next.name)) + '</a>' : '<span></span>') +
        '</nav>';
    }
    return html + '</div>';
  }

  function figResults() {
    var list = D.figures.filter(function (f) {
      return (!figFilter.country || f.country === figFilter.country) && (!figFilter.field || f.field === figFilter.field);
    });
    if (!list.length) { return '<p class="empty">' + esc(t('noFigures')) + '</p>'; }
    var groups = [];
    D.eras.forEach(function (e) {
      var inEra = list.filter(function (f) { return eraOf(f) === e; }).sort(function (a, b) { return a.born - b.born; });
      if (inEra.length) { groups.push({ era: e, list: inEra }); }
    });
    var nav = '<nav class="era-nav" aria-label="' + esc(t('eraNav')) + '">' + groups.map(function (g) {
      return '<a href="#/figures" data-scroll="era-' + esc(g.era.id) + '">' + esc(L(g.era.name)) + '</a>';
    }).join('') + '</nav>';
    var body = groups.map(function (g) {
      var from = g.era.from < -5000 ? '' : yearLabel(g.era.from);
      var to = g.era.to > 5000 ? '' : yearLabel(g.era.to);
      var range = from && to ? from + ' \u2013 ' + to : (from ? from + ' \u2013' : '\u2013 ' + to);
      return '<section class="era" id="era-' + esc(g.era.id) + '" style="--era:' + esc(g.era.color) + '">' +
        '<div class="era-banner"><h2>' + esc(L(g.era.name)) + '</h2><div class="range">' + esc(range) + '</div><p>' + esc(L(g.era.desc)) + '</p></div>' +
        '<div class="mini-grid">' + g.list.map(figCard).join('') + '</div></section>';
    }).join('');
    return nav + body;
  }

  function viewFigures() {
    var usedCountries = [], usedFields = [];
    D.figures.forEach(function (f) {
      if (usedCountries.indexOf(f.country) < 0) { usedCountries.push(f.country); }
      if (usedFields.indexOf(f.field) < 0) { usedFields.push(f.field); }
    });
    var cOpts = '<option value="">' + esc(t('all')) + '</option>' + usedCountries.map(function (id) {
      var c = findCountry(id);
      return '<option value="' + esc(id) + '"' + (figFilter.country === id ? ' selected' : '') + '>' + esc(c ? L(c.name) : id) + '</option>';
    }).join('');
    var fOpts = '<option value="">' + esc(t('all')) + '</option>' + usedFields.map(function (k) {
      return '<option value="' + esc(k) + '"' + (figFilter.field === k ? ' selected' : '') + '>' + esc(D.fields[k] ? L(D.fields[k]) : k) + '</option>';
    }).join('');
    return '<div class="page"><h1>' + esc(t('figuresTitle')) + '</h1><p class="lead">' + esc(t('figuresLead')) + '</p>' +
      '<div class="filters">' +
      '<div><label for="f-country">' + esc(t('filterCountry')) + '</label><select id="f-country">' + cOpts + '</select></div>' +
      '<div><label for="f-field">' + esc(t('filterField')) + '</label><select id="f-field">' + fOpts + '</select></div>' +
      '<div><button type="button" class="btn" id="random-fig">' + esc(t('randomFigure')) + '</button></div>' +
      '</div><div id="fig-results">' + figResults() + '</div></div>';
  }

  function viewFigure(f) {
    var c = findCountry(f.country), era = eraOf(f);
    var end = f.died == null ? new Date().getFullYear() : f.died;
    var near = D.figures.filter(function (o) { return o !== f; }).map(function (o) {
      var oEnd = o.died == null ? new Date().getFullYear() : o.died;
      return { f: o, overlap: Math.min(end, oEnd) - Math.max(f.born, o.born) };
    }).filter(function (x) { return x.overlap >= 20; })
      .sort(function (a, b) { return b.overlap - a.overlap; }).slice(0, 4);

    var html = '<div class="page"><p class="crumb"><a href="#/figures">' + esc(t('backToFigures')) + '</a></p>' +
      '<header class="fig-head">' + monoHTML(f, true) + '<div><h1>' + esc(L(f.name)) + '</h1>' +
      '<p class="meta" style="margin:0">' + esc(lifespan(f)) + '</p>' +
      '<p class="meta" style="margin:0.25rem 0 0">' +
      (c ? esc(t('fromCountry')) + ': <a href="#/country/' + esc(c.id) + '">' + esc(L(c.name)) + '</a>. ' : '') +
      esc(t('fieldLabel')) + ': ' + esc(D.fields[f.field] ? L(D.fields[f.field]) : f.field) + '. ' +
      esc(t('eraLabel')) + ': ' + esc(L(era.name)) + '.</p></div></header>' +
      '<div class="fig-body"><p class="lead">' + esc(L(f.summary)) + '</p>' +
      '<h2>' + esc(t('biography')) + '</h2>' + paragraphs(f.bio);
    var ach = listOf(f.achievements);
    if (ach.length) {
      html += '<h2>' + esc(t('achievements')) + '</h2><ul>' + ach.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>';
    }
    if (f.quote && L(f.quote)) {
      html += '<h2>' + esc(t('famousQuote')) + '</h2><blockquote class="quote">' + esc(L(f.quote)) + '</blockquote>';
    }
    html += '</div>';
    if (near.length) {
      html += sectionTitle(t('contemporaries')) + '<div class="mini-grid">' + near.map(function (x) { return figCard(x.f); }).join('') + '</div>';
    }
    return html + '</div>';
  }

  function viewAges() {
    var list = D.countries.slice().sort(function (a, b) { return a.founded - b.founded; });
    var items = list.map(function (c) {
      return '<li class="age-item"><span class="yr">' + esc(yearLabel(c.founded)) + '</span><span class="dot"></span>' +
        '<div class="age-card frame"><h3><a href="#/country/' + esc(c.id) + '">' + esc(L(c.name)) + '</a></h3>' +
        '<div class="big-n">' + esc(ageText(c)) + '</div>' +
        (c.foundedNote ? '<details><summary>' + esc(t('whyDate')) + '</summary><p>' + esc(L(c.foundedNote)) + '</p></details>' : '') +
        '</div></li>';
    }).join('');
    return '<div class="page"><h1>' + esc(t('agesTitle')) + '</h1><p class="lead">' + esc(t('agesLead')) + '</p>' +
      '<p class="hint">' + esc(t('agesHint')) + '</p>' +
      '<div class="ages-scroller" tabindex="0" role="region" aria-label="' + esc(t('agesTitle')) + '"><ol class="ages-track" style="list-style:none;margin:0;padding-inline:0">' + items + '</ol></div></div>';
  }

  function viewNotFound() {
    return '<div class="page"><h1>' + esc(t('notFoundTitle')) + '</h1><p class="lead">' + esc(t('notFoundText')) + '</p>' +
      '<p><a href="#/">' + esc(t('navHome')) + '</a></p></div>';
  }

  /* ---------- router ---------- */
  function parseHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (h.charAt(0) !== '/') { h = '/'; }
    return h.split('/').filter(Boolean).map(function (x) {
      try { return decodeURIComponent(x); } catch (e) { return x; }
    });
  }

  function route(isLangChange) {
    var p = parseHash(), page = p[0] || '', view, title, section = '/', c, f;
    document.body.classList.remove('has-progress');

    if (page === '') { view = viewHome(); title = L(S.slogan); }
    else if (page === 'countries' && !p[1]) { view = viewCountries(); title = t('countriesTitle'); section = '/countries'; }
    else if (page === 'country' && (c = findCountry(p[1]))) {
      view = viewCountry(c); title = L(c.name); section = '/countries';
      document.body.classList.add('has-progress');
    }
    else if (page === 'figures' && !p[1]) { view = viewFigures(); title = t('figuresTitle'); section = '/figures'; }
    else if (page === 'figure' && (f = findFigure(p[1]))) { view = viewFigure(f); title = L(f.name); section = '/figures'; }
    else if (page === 'ages' && !p[1]) { view = viewAges(); title = t('agesTitle'); section = '/ages'; }
    else { view = viewNotFound(); title = t('notFoundTitle'); }

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    renderChrome(section);
    appEl.innerHTML = view;
    document.title = title + ' | Historium';
    if (!isLangChange) {
      window.scrollTo(0, 0);
      try { appEl.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
    updateProgress();
  }

  function updateProgress() {
    if (!document.body.classList.contains('has-progress')) { return; }
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    var r = max > 0 ? h.scrollTop / max : 0;
    progressEl.style.transform = 'scaleX(' + Math.min(1, Math.max(0, r)) + ')';
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var target = e.target;
    if (!target || !target.closest) { return; }

    if (target.closest('#lang-btn')) {
      lang = lang === 'fa' ? 'en' : 'fa';
      try { localStorage.setItem('historium-lang', lang); } catch (err) { /* ignore */ }
      route(true);
      return;
    }
    var sc = target.closest('[data-scroll]');
    if (sc) {
      e.preventDefault();
      var el = document.getElementById(sc.getAttribute('data-scroll'));
      if (el) { el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); }
      return;
    }
    if (target.closest('#random-fig')) {
      var pool = D.figures;
      if (pool.length) { location.hash = '#/figure/' + pool[Math.floor(Math.random() * pool.length)].id; }
    }
  });

  document.addEventListener('change', function (e) {
    var id = e.target && e.target.id;
    if (id === 'f-country' || id === 'f-field') {
      figFilter.country = document.getElementById('f-country').value;
      figFilter.field = document.getElementById('f-field').value;
      document.getElementById('fig-results').innerHTML = figResults();
    }
  });

  document.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'q') { return; }
    var q = norm(e.target.value.trim());
    var cards = document.querySelectorAll('#country-grid [data-search]');
    var shown = 0;
    Array.prototype.forEach.call(cards, function (card) {
      var match = !q || card.getAttribute('data-search').indexOf(q) !== -1;
      card.hidden = !match;
      if (match) { shown++; }
    });
    document.getElementById('no-results').hidden = shown !== 0;
  });

  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);
  window.addEventListener('hashchange', function () { route(false); });

  route(false);
})();

</script>
</body>
</html>
