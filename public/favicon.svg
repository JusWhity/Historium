<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="wax" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b22b20" />
      <stop offset="55%" stop-color="#801810" />
      <stop offset="100%" stop-color="#4a0d08" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d6" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997a15" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1a0805" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Wax Seal Outer Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#wax)" filter="url(#shadow)" />
  
  <!-- Subtle Organic Seal Edges -->
  <path d="M32 3 C36 3 40 4 44 6 C48 9 52 11 55 15 C58 19 60 23 61 28 C61 33 60 38 57 42 C54 47 51 51 46 54 C42 57 37 59 32 60 C27 60 22 59 18 56 C13 53 9 49 7 44 C4 40 3 35 3 30 C4 25 6 20 9 16 C13 11 17 8 22 5 C25 4 29 3 32 3 Z" fill="none" stroke="#5c120c" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner Embossed Border -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-dasharray="3,1.5" />
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.8" />

  <!-- Historic Laurel Wreath Left -->
  <path d="M21 40 C17 36 16 28 20 22 C21 20 23 19 24 20 C23 23 21 27 23 31 C24 34 27 37 28 39" fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Historic Laurel Wreath Right -->
  <path d="M43 40 C47 36 48 28 44 22 C43 20 41 19 40 20 C41 23 43 27 41 31 C40 34 37 37 36 39" fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Roman Imperial "H" Monogram -->
  <text x="32" y="38" font-family="'EB Garamond', 'Times New Roman', Georgia, serif" font-size="21" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="1">H</text>

  <!-- Top Star -->
  <polygon points="32,13 33.2,16 36.5,16 34,18 35,21 32,19.2 29,21 30,18 27.5,16 30.8,16" fill="url(#gold)"/>
</svg>
